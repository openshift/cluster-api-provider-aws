apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
- tools/vendor/github.com/openshift/cluster-capi-operator/manifests-gen

resources:
- ../config/default
- exclude-resources-config.yaml
- rename-resources-config.yaml

# Transformers run in order.
transformers:
- tools/vendor/github.com/openshift/cluster-capi-operator/manifests-gen/transformers/exclude-resources.yaml
- tools/vendor/github.com/openshift/cluster-capi-operator/manifests-gen/transformers/rename-resources.yaml

images:
- name: gcr.io/k8s-staging-cluster-api-aws/cluster-api-aws-controller
  newName: registry.ci.openshift.org/openshift
  newTag: aws-cluster-api-controllers

patches:

# Remove unsubstituted annotation from ServiceAccount
- target:
    kind: ServiceAccount
    name: capa-controller-manager
  patch: |-
    - op: remove
      path: /metadata/annotations/${AWS_CONTROLLER_IAM_ROLE~1#arn~1eks.amazonaws.com~1role-arn

# Disable EKS feature gate: EKS controllers watch CRDs excluded from the manifests,
# causing cache sync timeout and manager crash.
- target:
    kind: Deployment
    name: capa-controller-manager
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: "--feature-gates=EKS=${CAPA_EKS:=false},EKSEnableIAM=${CAPA_EKS_IAM:=false},EKSAllowAddRoles=${CAPA_EKS_ADD_ROLES:=false},EKSFargate=${EXP_EKS_FARGATE:=false},MachinePool=${EXP_MACHINE_POOL:=false},MachinePoolMachines=${EXP_MACHINE_POOL_MACHINES:=false},EventBridgeInstanceState=${EVENT_BRIDGE_INSTANCE_STATE:=false},AutoControllerIdentityCreator=${AUTO_CONTROLLER_IDENTITY_CREATOR:=true},BootstrapFormatIgnition=${EXP_BOOTSTRAP_FORMAT_IGNITION:=false},ExternalResourceGC=${EXTERNAL_RESOURCE_GC:=true},AlternativeGCStrategy=${ALTERNATIVE_GC_STRATEGY:=false},TagUnmanagedNetworkResources=${TAG_UNMANAGED_NETWORK_RESOURCES:=true},ROSA=${EXP_ROSA:=false}"

# Add TLS configuration args (substituted by cluster-capi-operator revisiongenerator)
- target:
    kind: Deployment
    name: capa-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--tls-min-version=${TLS_MIN_VERSION}"
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--tls-cipher-suites=${TLS_CIPHER_SUITES}"

# Add projected bound SA token volume for OpenShift OIDC/STS authentication
- target:
    kind: Deployment
    name: capa-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: bound-sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: openshift
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: bound-sa-token
        mountPath: /var/run/secrets/openshift/serviceaccount
        readOnly: true
