    served: false
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - description: Cluster to which this AWSCluster belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Cluster infrastructure is ready for EC2 instances
      jsonPath: .status.ready
      name: Ready
      type: string
    - description: AWS VPC the cluster is using
      jsonPath: .spec.network.vpc.id
      name: VPC
      type: string
    - description: API Endpoint
      jsonPath: .spec.controlPlaneEndpoint
      name: Endpoint
      priority: 1
      type: string
    - description: Bastion IPv4 address for breakglass access
      jsonPath: .status.bastion.publicIp
      name: Bastion IP
      type: string
    - description: Bastion IPv6 address for breakglass access
      jsonPath: .status.bastion.ipv6Address
      name: Bastion IPv6
      type: string
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: AWSCluster is the schema for Amazon EC2 based Kubernetes Cluster
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AWSClusterSpec defines the desired state of an EC2-based
              Kubernetes cluster.
            properties:
              additionalTags:
                additionalProperties:
                  type: string
                description: |-
                  AdditionalTags is an optional set of tags to add to AWS resources managed by the AWS provider, in addition to the
                  ones added by default.
                type: object
              bastion:
                description: Bastion contains options to configure the bastion host.
                properties:
                  allowedCIDRBlocks:
                    description: |-
                      AllowedCIDRBlocks is a list of CIDR blocks allowed to access the bastion host.
                      They are set as ingress rules for the Bastion host's Security Group (defaults to 0.0.0.0/0).
                      If the cluster has IPv6 enabled, defaults to ::/0 and 0.0.0.0/0.
                    items:
                      type: string
                    type: array
                  ami:
                    description: |-
                      AMI will use the specified AMI to boot the bastion. If not specified,
                      the AMI will default to one picked out in public space.
                    type: string
                  disableIngressRules:
                    description: |-
                      DisableIngressRules will ensure there are no Ingress rules in the bastion host's security group.
                      Requires AllowedCIDRBlocks to be empty.
                    type: boolean
                  enabled:
                    description: |-
                      Enabled allows this provider to create a bastion host instance
                      with a public ip to access the VPC private network.
                    type: boolean
                  instanceType:
                    description: |-
                      InstanceType will use the specified instance type for the bastion. If not specified,
                      Cluster API Provider AWS will use t3.micro for all regions except us-east-1, where t2.micro
                      will be the default.
                    type: string
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint represents the endpoint used to
                  communicate with the control plane.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    type: integer
                type: object
              controlPlaneLoadBalancer:
                description: ControlPlaneLoadBalancer is optional configuration for
                  customizing control plane behavior.
                properties:
                  additionalListeners:
                    description: |-
                      AdditionalListeners sets the additional listeners for the control plane load balancer.
                      This is only applicable to Network Load Balancer (NLB) types for the time being.
                    items:
                      description: |-
                        AdditionalListenerSpec defines the desired state of an
                        additional listener on an AWS load balancer.
                      properties:
                        healthCheck:
                          description: HealthCheck sets the optional custom health
                            check configuration to the API target group.
                          properties:
                            intervalSeconds:
                              description: |-
                                The approximate amount of time, in seconds, between health checks of an individual
                                target.
                              format: int64
                              maximum: 300
                              minimum: 5
                              type: integer
                            path:
                              description: |-
                                The destination for health checks on the targets when using the protocol HTTP or HTTPS,
                                otherwise the path will be ignored.
                              type: string
                            port:
                              description: |-
                                The port the load balancer uses when performing health checks for additional target groups. When
                                not specified this value will be set for the same of listener port.
                              type: string
                            protocol:
                              description: |-
                                The protocol to use to health check connect with the target. When not specified the Protocol
                                will be the same of the listener.
                              enum:
                              - TCP
                              - HTTP
                              - HTTPS
                              type: string
                            thresholdCount:
                              description: |-
                                The number of consecutive health check successes required before considering
                                a target healthy.
                              format: int64
                              maximum: 10
                              minimum: 2
                              type: integer
                            timeoutSeconds:
                              description: |-
                                The amount of time, in seconds, during which no response from a target means
                                a failed health check.
                              format: int64
                              maximum: 120
                              minimum: 2
                              type: integer
                            unhealthyThresholdCount:
                              description: |-
                                The number of consecutive health check failures required before considering
                                a target unhealthy.
                              format: int64
                              maximum: 10
                              minimum: 2
                              type: integer
                          type: object
                        port:
                          description: Port sets the port for the additional listener.
                          format: int64
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          default: TCP
                          description: |-
                            Protocol sets the protocol for the additional listener.
                            Currently only TCP is supported.
                          enum:
                          - TCP
                          type: string
                        targetGroupIPType:
                          description: |-
                            TargetGroupIPType sets the IP address type for the target group.
                            Valid values are ipv4 and ipv6. If not specified, defaults to ipv4 unless
                            the VPC has IPv6 enabled, in which case it defaults to ipv6.
                            This field cannot be set if LoadBalancerType is classic or disabled.
                          enum:
                          - ipv4
                          - ipv6
                          type: string
                      required:
                      - port
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - port
                    x-kubernetes-list-type: map
                  additionalSecurityGroups:
                    description: |-
                      AdditionalSecurityGroups sets the security groups used by the load balancer. Expected to be security group IDs
                      This is optional - if not provided new security groups will be created for the load balancer
                    items:
                      type: string
                    type: array
                  crossZoneLoadBalancing:
                    description: |-
                      CrossZoneLoadBalancing enables the classic ELB cross availability zone balancing.

                      With cross-zone load balancing, each load balancer node for your Classic Load Balancer
                      distributes requests evenly across the registered instances in all enabled Availability Zones.
                      If cross-zone load balancing is disabled, each load balancer node distributes requests evenly across
                      the registered instances in its Availability Zone only.

                      Defaults to false.
                    type: boolean
                  disableHostsRewrite:
                    description: |-
                      DisableHostsRewrite disabled the hair pinning issue solution that adds the NLB's address as 127.0.0.1 to the hosts
                      file of each instance. This is by default, false.
                    type: boolean
                  dnsResolutionCheck:
                    description: |-
                      DNSResolutionCheck configures the behavior for checking the load balancer DNS resolution.
                      Set to "None" to disable the check.
                      If omitted, the DNS resolution check is enabled.
                    enum:
                    - None
                    - Enabled
                    type: string
                  healthCheck:
                    description: HealthCheck sets custom health check configuration
                      to the API target group.
                    properties:
                      intervalSeconds:
                        description: |-
                          The approximate amount of time, in seconds, between health checks of an individual
                          target.
                        format: int64
                        maximum: 300
                        minimum: 5
                        type: integer
                      thresholdCount:
                        description: |-
                          The number of consecutive health check successes required before considering
                          a target healthy.
                        format: int64
                        maximum: 10
                        minimum: 2
                        type: integer
                      timeoutSeconds:
                        description: |-
                          The amount of time, in seconds, during which no response from a target means
                          a failed health check.
                        format: int64
                        maximum: 120
                        minimum: 2
                        type: integer
                      unhealthyThresholdCount:
                        description: |-
                          The number of consecutive health check failures required before considering
                          a target unhealthy.
                        format: int64
                        maximum: 10
                        minimum: 2
                        type: integer
                    type: object
                  healthCheckProtocol:
                    description: |-
                      HealthCheckProtocol sets the protocol type for ELB health check target
                      default value is ELBProtocolSSL
                    enum:
                    - TCP
                    - SSL
                    - HTTP
                    - HTTPS
                    - TLS
                    - UDP
                    type: string
                  ingressRules:
                    description: IngressRules sets the ingress rules for the control
                      plane load balancer.
                    items:
                      description: IngressRule defines an AWS ingress rule for security
                        groups.
                      properties:
                        cidrBlocks:
                          description: List of CIDR blocks to allow access from. Cannot
                            be specified with SourceSecurityGroupID.
                          items:
                            type: string
                          type: array
                        description:
                          description: Description provides extended information about
                            the ingress rule.
                          type: string
                        fromPort:
                          description: FromPort is the start of port range.
                          format: int64
                          type: integer
                        ipv6CidrBlocks:
                          description: List of IPv6 CIDR blocks to allow access from.
                            Cannot be specified with SourceSecurityGroupID.
                          items:
                            type: string
                          type: array
                        natGatewaysIPsSource:
                          description: NatGatewaysIPsSource use the NAT gateways IPs
                            as the source for the ingress rule.
                          type: boolean
                        protocol:
                          description: Protocol is the protocol for the ingress rule.
                            Accepted values are "-1" (all), "4" (IP in IP),"tcp",
                            "udp", "icmp", and "58" (ICMPv6), "50" (ESP).
                          enum:
                          - "-1"
                          - "4"
                          - tcp
                          - udp
                          - icmp
                          - "58"
                          - "50"
                          type: string
                        sourceSecurityGroupIds:
                          description: The security group id to allow access from.
                            Cannot be specified with CidrBlocks.
                          items:
                            type: string
                          type: array
                        sourceSecurityGroupRoles:
                          description: |-
                            The security group role to allow access from. Cannot be specified with CidrBlocks.
                            The field will be combined with source security group IDs if specified.
                          items:
                            description: SecurityGroupRole defines the unique role
                              of a security group.
                            enum:
                            - bastion
                            - node
                            - controlplane
                            - apiserver-lb
                            - lb
                            - node-eks-additional
                            type: string
                          type: array
                        toPort:
                          description: ToPort is the end of port range.
                          format: int64
                          type: integer
                      required:
                      - description
                      - fromPort
                      - protocol
                      - toPort
                      type: object
                    type: array
                  loadBalancerType:
                    default: classic
                    description: LoadBalancerType sets the type for a load balancer.
                      The default type is classic.
                    enum:
                    - classic
                    - elb
                    - alb
                    - nlb
                    - disabled
                    type: string
                  name:
                    description: |-
                      Name sets the name of the classic ELB load balancer. As per AWS, the name must be unique
                      within your set of load balancers for the region, must have a maximum of 32 characters, must
                      contain only alphanumeric characters or hyphens, and cannot begin or end with a hyphen. Once
                      set, the value cannot be changed.
                    maxLength: 32
                    pattern: ^[A-Za-z0-9]([A-Za-z0-9]{0,31}|[-A-Za-z0-9]{0,30}[A-Za-z0-9])$
                    type: string
                  preserveClientIP:
                    description: |-
                      PreserveClientIP lets the user control if preservation of client ips must be retained or not.
                      If this is enabled 6443 will be opened to 0.0.0.0/0.
                    type: boolean
                  scheme:
                    default: internet-facing
                    description: Scheme sets the scheme of the load balancer (defaults
