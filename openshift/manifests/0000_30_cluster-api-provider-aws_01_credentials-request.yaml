---
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: openshift-cluster-api-aws
  namespace: openshift-cloud-credential-operator
  annotations:
    capability.openshift.io/name: CloudCredential+ClusterAPI
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement,ClusterAPIMachineManagementAWS"
spec:
  serviceAccountNames:
    - capa-controller-manager
  secretRef:
    name: capa-manager-bootstrap-credentials
    namespace: openshift-cluster-api
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      - effect: Allow
        action:
          - ec2:AllocateHosts
          - ec2:CreateTags
          - ec2:DescribeDhcpOptions
          - ec2:DescribeImages
          - ec2:DescribeInstances
          - ec2:DescribeInstanceTypes
          - ec2:DescribeSecurityGroups
          - ec2:DescribeSubnets
          - ec2:DescribeVpcs
          - ec2:DescribeNetworkInterfaces
          - ec2:DescribeNetworkInterfaceAttribute
          - ec2:ModifyNetworkInterfaceAttribute
          - ec2:ReleaseHosts
          - ec2:RunInstances
          - ec2:TerminateInstances
          - elasticloadbalancing:DescribeLoadBalancers
          - elasticloadbalancing:DescribeTargetGroups
          - elasticloadbalancing:DescribeTargetHealth
          - elasticloadbalancing:RegisterInstancesWithLoadBalancer
          - elasticloadbalancing:RegisterTargets
          - elasticloadbalancing:DeregisterTargets
          - iam:PassRole
        resource: "*"
      - effect: Allow
        action:
          - kms:Decrypt
          - kms:Encrypt
          - kms:GenerateDataKey
          - kms:GenerateDataKeyWithoutPlainText
          - kms:DescribeKey
        resource: "*"
      - effect: Allow
        action:
          - kms:RevokeGrant
          - kms:CreateGrant
          - kms:ListGrants
        resource: "*"
        policyCondition:
          "Bool":
            "kms:GrantIsForAWSResource": true
